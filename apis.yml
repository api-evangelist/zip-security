name: Zip Security
description: 'Zip Security is a cloud-based security, IT, and compliance platform that
  automates identity management, device management (MDM for macOS, Windows, iOS, and
  Android), and endpoint threat detection for small and mid-sized businesses. It unifies
  tools such as Microsoft Intune, Jamf, and CrowdStrike behind a single dashboard,
  deploying frameworks, policies, and controls that are continuously enforced to help
  teams reach SOC 2, HIPAA, ISO 27001, CMMC, and PCI readiness, often within two weeks.
  Zip Security is backed by General Catalyst. This profile currently exposes no public
  developer API; it is tracked in the API Evangelist network as a company profile.'
